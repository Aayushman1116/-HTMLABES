<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="css file.css">
</head>
<body>
        <center><fieldset align="center" style="color: #f50909; width: 500px; height: 600px;">
        <legend>User Personal Information</legend>
        <label for="name">Enter your full name:</label>
        <input type="text" id="name"><br><br>
        <label for="email">Enter your email:</label>
        <input type="text" id="email"><br><br>
        <label for="password">Enter your password:</label>
        <input type="text" id="password"><br><br>
        <label for="confirm_password">Confirm password:</label>
        <input type="text" id="confirm_password"><br><br>
        <label for="Gender">Enter your Gender:</label>
        <input type="radio" id="Gender" name="Gender" value="Male">male
        <input type="radio" id="Gender" name="Gender" value="Female">female
        <input type="radio" id="Gender" name="Gender" value="Others">others<br><br>
        <label for="Date of Birth">Enter your Date of Birth:</label>
        <input type="date" id="Date of Birth"><br><br>
        <label for="Blood Group">Enter your Blood Group:</label>
        <input type="radio" id="Blood Group" name="Blood Group" value="A+">A+
        <input type="radio" id="Blood Group" name="Blood Group" value="A-">A-
        <input type="radio" id="Blood Group" name="Blood Group" value="B+">B+
        <input type="radio" id="Blood Group" name="Blood Group" value="B-">B-<br>
        <input type="radio" id="Blood Group" name="Blood Group" value="O+">O+
        <input type="radio" id="Blood Group" name="Blood Group" value="O-">O-
        <input type="radio" id="Blood Group" name="Blood Group" value="AB+">AB+
        <input type="radio" id="Blood Group" name="Blood Group" value="AB-">AB-<br><br>
        <label for="Phone Number">Enter your Phone Number:</label>
        <input type="text" id="Phone Number"><br><br>
        <label for="Address">Enter your Address:</label>
        <input type="text" id="Address"><br><br>
        <label for="Group">Enter your College Group:</label>
        <select id="Group" name="Group">
            <option value="Group1">--select--</option>
            <option value="Group2">Electrical</option>
            <option value="Group3">Electronics</option>
        </select><br><br>
        <label for="Subject">Enter your Subject:</label>
        <input type="checkbox" id="Subject" name="subject">Maths
        <input type="checkbox" id="Subject" name="subject">Physics
        <input type="checkbox" id="Subject" name="subject">C++
        <input type="checkbox" id="Subject" name="subject">Electrical<br>
        <input type="checkbox" id="Subject" name="subject">Web Designing
        <input type="checkbox" id="Subject" name="subject">AI
        <input type="checkbox" id="Subject" name="subject">EVS
        <input type="checkbox" id="Subject" name="subject">Mechanical
        <input type="checkbox" id="Subject" name="subject">Electronics<br>
        <input type="checkbox" id="Subject" name="subject">Digital Manfucturing
        <input type="checkbox" id="Subject" name="subject">Soft Skills
        <br> 
        <label for="File">Upload your file:</label>
        <input type="file" id="File"><br>
        <input type="submit" value="Submit">
        </fieldset></center>

</body>
</html>
